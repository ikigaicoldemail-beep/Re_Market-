name: remarket3

x-app-environment: &app-environment
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:8000
  APP_FRONTEND_URL: http://localhost:3000
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: marketplace_backend
  DB_USERNAME: marketplace
  DB_PASSWORD: marketplace
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  SESSION_DRIVER: database
  FILESYSTEM_DISK: public
  MAIL_MAILER: log
  VISUAL_SEARCH_PYTHON: python3
  VISUAL_SEARCH_MODEL: ViT-B-32
  VISUAL_SEARCH_PRETRAINED: openai
  VISUAL_SEARCH_DEVICE: cpu
  VISUAL_SEARCH_TIMEOUT: 900
  HF_HOME: /var/www/.cache/huggingface
  TORCH_HOME: /var/www/.cache/torch

x-app-volumes: &app-volumes
  - ./:/var/www/html
  - huggingface_cache:/var/www/.cache/huggingface
  - torch_cache:/var/www/.cache/torch

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # Trim MySQL's memory footprint so Docker/WSL2 stops OOM-killing it (exit 137).
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      - --mysqlx=OFF
    environment:
      MYSQL_DATABASE: marketplace_backend
      MYSQL_USER: marketplace
      MYSQL_PASSWORD: marketplace
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "33061:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes: *app-volumes
    environment: *app-environment
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes: *app-volumes
    environment: *app-environment
    depends_on:
      mysql:
        condition: service_healthy
    command: php artisan queue:work --queue=default,ai,social --tries=3 --timeout=900

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes: *app-volumes
    environment: *app-environment
    depends_on:
      mysql:
        condition: service_healthy
    command: php artisan schedule:work

volumes:
  mysql_data:
  huggingface_cache:
  torch_cache:
